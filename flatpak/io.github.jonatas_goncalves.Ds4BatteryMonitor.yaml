app-id: io.github.jonatas_goncalves.Ds4BatteryMonitor
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: ds4-battery-monitor
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --filesystem=/sys/class/power_supply:ro

modules:
  - name: ds4-battery-monitor
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/ds4-battery-monitor/icons
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - install -D -m 0755 ds4-battery-monitor.py /app/bin/ds4-battery-monitor
      - install -m 0644 icons/*.png /app/share/ds4-battery-monitor/icons/
      - install -m 0644 icons/icon_default.png /app/share/icons/hicolor/scalable/apps/io.github.jonatas_goncalves.Ds4BatteryMonitor.png
      - install -D -m 0644 flatpak/io.github.jonatas_goncalves.Ds4BatteryMonitor.desktop /app/share/applications/io.github.jonatas_goncalves.Ds4BatteryMonitor.desktop
      - install -D -m 0644 flatpak/io.github.jonatas_goncalves.Ds4BatteryMonitor.desktop /app/etc/xdg/autostart/io.github.jonatas_goncalves.Ds4BatteryMonitor.desktop
      - install -D -m 0644 flatpak/io.github.jonatas_goncalves.Ds4BatteryMonitor.metainfo.xml /app/share/metainfo/io.github.jonatas_goncalves.Ds4BatteryMonitor.metainfo.xml
    sources:
      - type: dir
        path: ..
