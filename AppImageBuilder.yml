version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: io.github.jonatas_goncalves.Ds4BatteryMonitor
    name: DS4 Battery Monitor
    version: 0.1.3
    exec: usr/bin/python3
    exec_args: $APPDIR/usr/bin/ds4-battery-monitor.py
    icon: io.github.jonatas_goncalves.Ds4BatteryMonitor

  apt:
    arch: amd64
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble main universe
    include:
      - python3
      - python3-pip
      - python3-gi
      - python3-evdev
      - python3-cairo
      - gir1.2-ayatanaappindicator3-0.1
      - libgtk-3-0
  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc

script:
  - mkdir -p AppDir/usr/bin
  - mkdir -p AppDir/usr/share/ds4-battery-monitor/icons
  - mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
  - mkdir -p AppDir/usr/share/applications
  - cp ds4-battery-monitor.py AppDir/usr/bin/
  - chmod +x AppDir/usr/bin/ds4-battery-monitor.py
  - cp icons/*.png AppDir/usr/share/ds4-battery-monitor/icons/
  - cp flatpak/io.github.jonatas_goncalves.Ds4BatteryMonitor.desktop AppDir/usr/share/applications/
  - cp icons/icon_default.png AppDir/usr/share/icons/hicolor/256x256/apps/io.github.jonatas_goncalves.Ds4BatteryMonitor.png

AppImage:
  arch: x86_64
  update-information: none
