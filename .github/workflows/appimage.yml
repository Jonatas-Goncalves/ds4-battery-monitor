name: AppImage Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install appimage-builder and dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            pipx \
            appstream \
            file \
            wget \
            desktop-file-utils \
            libfuse2t64 \
            fakeroot \
            fuse \
            squashfs-tools \
            zsync \
            libgtk-3-bin

          cd /tmp

          pipx install appimage-builder

          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build AppImage
        run: |
          mkdir -p AppDir
          appimage-builder --recipe AppImageBuilder.yml --skip-tests

      - name: Upload Artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: DS4-Battery-Monitor-AppImage
          path: './*.AppImage'

      - name: Release AppImage
        if: ${{ !env.ACT && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: './*.AppImage'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
